<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valence | Live Classes</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Plyr & HLS for Premium Video Playback -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- Tailwind Config for Valence Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#050505',
                        cardBg: '#0a0a0c',
                        cardHover: '#121214',
                        themeYellow: '#FACC15',
                        themeAmber: '#F59E0B',
                        themeGreen: '#10B981',
                        themeRed: '#EF4444',
                        textDim: '#8A8A8A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #d6d3d1; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        .bg-yellow-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(250, 204, 21, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(250, 204, 21, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at top center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at top center, black 40%, transparent 80%);
            animation: gridPulse 15s ease-in-out infinite alternate;
        }

        @keyframes gridPulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }
        
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.15; }
            33% { transform: translate(30px, -50px) scale(1.1) rotate(120deg); opacity: 0.25; }
            66% { transform: translate(-20px, 20px) scale(0.9) rotate(240deg); opacity: 0.2; }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); opacity: 0.15; }
        }
        .orb-1 { animation: drift 15s infinite ease-in-out; }
        .orb-2 { animation: drift 20s infinite ease-in-out reverse; }

        /* Fetcher Animations */
        @keyframes lc-pulse-ring { 0% { transform: scale(0.85); opacity: 0.8; } 100% { transform: scale(2.8); opacity: 0; } }
        @keyframes lc-led-blink { 0%,42%,58%,100% { opacity: 1; } 50% { opacity: 0.15; } }
        @keyframes lc-sweep { 0% { left: -80%; } 100% { left: 140%; } }
        @keyframes lc-signal-bar { 0%,100% { opacity: 0.25; transform: scaleY(0.45); } 50% { opacity: 1; transform: scaleY(1); } }
        @keyframes lc-timer-glow { 0%,100% { text-shadow: 0 0 6px rgba(250,204,21,0.5), 0 0 14px rgba(250,204,21,0.2); } 50% { text-shadow: 0 0 12px rgba(250,204,21,0.9), 0 0 28px rgba(250,204,21,0.4); } }
        
        .lc-live-dot-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .lc-live-dot-wrap::before, .lc-live-dot-wrap::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgba(239,68,68,0.5); animation: lc-pulse-ring 1.8s ease-out infinite; }
        .lc-live-dot-wrap::after { animation-delay: 0.9s; }
        .lc-live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; position: relative; z-index: 1; box-shadow: 0 0 5px rgba(239,68,68,1), 0 0 12px rgba(239,68,68,0.5); animation: lc-led-blink 2.8s ease-in-out infinite; }
        
        .lc-sig-bar { animation: lc-signal-bar 1s ease-in-out infinite; }
        .lc-sig-bar:nth-child(1) { animation-delay: 0s; }
        .lc-sig-bar:nth-child(2) { animation-delay: 0.18s; }
        .lc-sig-bar:nth-child(3) { animation-delay: 0.36s; }
        .lc-sig-bar:nth-child(4) { animation-delay: 0.54s; }
        
        .lc-timer-digit { animation: lc-timer-glow 2.2s ease-in-out infinite; font-family: 'JetBrains Mono', monospace; }
        .lc-watch-btn { position: relative; overflow: hidden; }
        .lc-watch-btn::after { content: ''; position: absolute; top: 0; left: -80%; width: 45%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: skewX(-15deg); }
        .lc-watch-btn:hover::after { animation: lc-sweep 0.6s ease forwards; }
        
        .glass-panel { background: rgba(10, 10, 12, 0.75); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8); }
        .btn-click-effect { transition: transform 0.15s ease-out; }
        .btn-click-effect:active { transform: scale(0.92); }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        :root {
            --plyr-color-main: #FACC15;
            --plyr-video-control-color-hover: #000;
            --plyr-video-control-background-hover: #FACC15;
            --plyr-menu-background: #0a0a0c;
            --plyr-menu-color: #fff;
            --plyr-tooltip-background: #FACC15;
            --plyr-tooltip-color: #000;
            --plyr-menu-radius: 1rem;
            --plyr-control-radius: 0.5rem;
        }

        .plyr { border-radius: 1.5rem; width: 100%; height: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); background: #000; }
        .plyr__control--overlaid { background: rgba(250, 204, 21, 0.9) !important; color: #000 !important; padding: 1.5rem !important; box-shadow: 0 0 30px rgba(250, 204, 21, 0.5) !important; transition: all 0.3s ease !important; }
        .plyr__control--overlaid:hover { transform: scale(1.1) !important; background: rgba(250, 204, 21, 1) !important; box-shadow: 0 0 40px rgba(250, 204, 21, 0.8) !important; }
        .plyr__control--overlaid svg { width: 2rem !important; height: 2rem !important; }
        .plyr--fullscreen-fallback, .plyr:-webkit-full-screen, .plyr:fullscreen { border-radius: 0 !important; }
        .plyr__controls { background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%) !important; padding-bottom: calc(15px + env(safe-area-inset-bottom)) !important; }
        .plyr__controls .custom-icon-svg { fill: none !important; }
        .plyr__controls .custom-icon-text { fill: currentColor !important; stroke: none !important; }
        .plyr__progress { flex: 1 1 40% !important; }
        @media (max-width: 768px) { .plyr__volume { max-width: 60px !important; min-width: 40px !important; } .plyr__time { font-size: 11px !important; } }

        .control-btn { background: #111111; color: #8A8A8A; border: 1px solid rgba(255,255,255,0.05); padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 700; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .control-btn:hover { background: #1a1a1a; color: #fff; border-color: rgba(250, 204, 21, 0.4); }
        .control-btn.active { background: #FACC15; color: #000; border-color: #FACC15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }
    
        .brand-gold{font-family:'Cinzel',serif;font-weight:800;letter-spacing:.14em;background:linear-gradient(110deg,#f9e7b3,#fff8e0 45%,#d4af37 70%,#f9e7b3);background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brandShine 6s linear infinite}
        @keyframes brandShine{to{background-position:220% center}}
    </style>
</head>

    <script>
        // Live API endpoint (CORS-enabled) so the mirror works from anywhere
        const WORKER_BASE_URL = "https://mjv.iownprince5.workers.dev/";
        const FALLBACK_THUMBNAIL = 'https://decicqog4ulhy.cloudfront.net/0/admin_v2/uploads/courses/thumbnail/2671188_1_logo.jpg';

        let activeTab = 'LIVE';
        let liveItems = [];
        let upcomingItems = [];

        window.playerInstance = null;
        window.hlsInstance = null;

        // Global Course ID reading from URL
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        // Custom Toast Function
        function showToast(message, type = 'info') {
            const toast = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            const toastIconContainer = document.getElementById('toast-icon-container');

            toastMsg.innerText = message;
            if (type === 'error') {
                toastIconContainer.className = "w-8 h-8 rounded-xl flex items-center justify-center bg-red-500/10 text-themeRed border border-red-500/20";
                toastIcon.setAttribute('data-lucide', 'alert-triangle');
            } else if (type === 'success') {
                toastIconContainer.className = "w-8 h-8 rounded-xl flex items-center justify-center bg-themeGreen/10 text-themeGreen border border-themeGreen/20";
                toastIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                toastIconContainer.className = "w-8 h-8 rounded-xl flex items-center justify-center bg-themeYellow/10 text-themeYellow border border-themeYellow/20";
                toastIcon.setAttribute('data-lucide', 'bell');
            }

            lucide.createIcons({root: toastIconContainer});

            toast.classList.remove('opacity-0', 'translate-y-[-100px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-100px]', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        function switchTab(tab) {
            activeTab = tab;
            const liveBtn = document.getElementById('tab-live-btn');
            const upcomingBtn = document.getElementById('tab-upcoming-btn');

            if (tab === 'LIVE') {
                liveBtn.style = "background: linear-gradient(135deg, rgba(250,204,21,0.12) 0%, rgba(30,20,10,0.6) 100%); border: 1px solid rgba(250,204,21,0.35); color: #FACC15; box-shadow: 0 0 18px rgba(250,204,21,0.1);";
                upcomingBtn.style = "border: 1px solid transparent; color: rgba(255,255,255,0.35);";
            } else {
                upcomingBtn.style = "background: linear-gradient(135deg, rgba(250,204,21,0.14) 0%, rgba(30,20,10,0.6) 100%); border: 1px solid rgba(250,204,21,0.35); color: #FACC15; box-shadow: 0 0 18px rgba(250,204,21,0.1);";
                liveBtn.style = "border: 1px solid transparent; color: rgba(255,255,255,0.35);";
            }
            renderCards();
        }

        async function loadCourseClasses() {
            const container = document.getElementById('cards-container');
            const loader = document.getElementById('loader');

            if (!courseId) {
                showToast("Course ID missing in URL!", "error");
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-center">
                        <i data-lucide="alert-circle" class="w-16 h-16 mb-4 opacity-50 text-red-500"></i>
                        <h3 class="text-lg font-bold mb-1 text-gray-200">Invalid Link</h3>
                        <p class="text-sm text-gray-500 font-medium">Please provide a valid Course ID in the URL (e.g. ?id=101).</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';
            loader.style.display = 'flex';

            // SECURE: Proxied through /api/api
            const liveUrl = `${WORKER_BASE_URL}?action=classes&type=1&course_id=${courseId}`;
            const upcomingUrl = `${WORKER_BASE_URL}?action=classes&type=0&course_id=${courseId}`;

            try {
                const [liveRes, upcomingRes] = await Promise.all([
                    fetch(liveUrl).then(r => r.json()).catch(() => null),
                    fetch(upcomingUrl).then(r => r.json()).catch(() => null)
                ]);

                const rawLive = (liveRes && liveRes.data && Array.isArray(liveRes.data)) ? liveRes.data : [];
                const rawUpcoming = (upcomingRes && upcomingRes.data && Array.isArray(upcomingRes.data)) ? upcomingRes.data : [];

                liveItems = rawLive.filter(i => i.is_live === 1 || String(i.live_status) === "1");
                upcomingItems = rawUpcoming.filter(i => i.is_live !== 1 && String(i.live_status) !== "1");

                const badgeLive = document.getElementById('badge-live-count');
                const badgeUpcoming = document.getElementById('badge-upcoming-count');

                badgeLive.innerText = liveItems.length;
                badgeLive.style.display = liveItems.length > 0 ? 'inline-block' : 'none';

                badgeUpcoming.innerText = upcomingItems.length;
                badgeUpcoming.style.display = upcomingItems.length > 0 ? 'inline-block' : 'none';

                if (liveItems.length === 0 && upcomingItems.length > 0) {
                    switchTab('UPCOMING');
                } else {
                    switchTab('LIVE');
                }
            } catch (err) {
                console.error("API Error:", err);
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-red-400">
                        <p class="font-bold">Failed to load classes from API.</p>
                        <p class="text-xs text-gray-500 mt-1">${err.message}</p>
                    </div>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        function triggerPlayerView(fileUrl, title, thumbnail, isLive) {
            if (!fileUrl || fileUrl === 'undefined' || fileUrl === 'null') {
                showToast("Live stream link is not available yet!", "error");
                return;
            }
            
            document.getElementById('fetcher-view').classList.remove('block');
            document.getElementById('fetcher-view').classList.add('hidden');
            
            document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('player-view').classList.add('block');
            
            initVideoPlayer(fileUrl, title || "Premium Class", thumbnail || FALLBACK_THUMBNAIL, isLive);
        }

        function closePlayer() {
            if (window.playerInstance) { window.playerInstance.destroy(); window.playerInstance = null; }
            if (window.hlsInstance) { window.hlsInstance.destroy(); window.hlsInstance = null; }

            document.getElementById('player-view').classList.remove('block');
            document.getElementById('player-view').classList.add('hidden');
            
            document.getElementById('fetcher-view').classList.remove('hidden');
            document.getElementById('fetcher-view').classList.add('block');
        }

                                <div class="lc-live-dot-wrap" style="width: 7px; height: 7px;"><div class="lc-live-dot" style="width: 5px; height: 5px;"></div></div>
                                <span style="font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: #fca5a5;">LIVE</span>
                            </div>
                            ` : `
                            <div class="absolute top-2.5 left-2.5 flex items-center gap-1 px-2 py-0.5 rounded-md backdrop-blur-sm" style="background: rgba(25,20,5,0.75); border: 1px solid rgba(250,204,21,0.3);">
                                <span style="font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: #FACC15;">SOON</span>
                            </div>
                            `}
                        </div>
                    </div>

                    <div class="p-4 flex flex-col flex-1">
                        <div class="mb-2.5">
                            <span class="inline-flex items-center gap-1.5 text-[10px] font-bold rounded-lg px-2.5 py-1 max-w-full truncate" style="background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.2); color: rgba(250,204,21,0.9);">${courseTitle}</span>
                        </div>
                        
                        <div class="min-h-[2.5rem] flex items-start mb-2.5">
                            <h3 class="font-extrabold text-[13px] sm:text-[14px] leading-snug line-clamp-2 group-hover:text-themeYellow transition-colors" style="color: rgba(240,240,240,0.92);">${item.title || 'Untitled Class'}</h3>
                        </div>
                        
                        <div class="flex items-center gap-2 text-[11px] mb-3.5 px-2.5 py-2 rounded-lg" style="background: rgba(20,15,5,0.5); border: 1px solid rgba(250,204,21,0.08);">
                            ${isLive ? `
                            <div class="w-1.5 h-1.5 rounded-full shrink-0" style="background: #4ade80; box-shadow: 0 0 5px rgba(74,222,128,0.8); animation: lc-led-blink 2s ease-in-out infinite;"></div>
                            <span style="color: rgba(148,163,184,0.7);">Started at</span><span class="font-bold" style="color: #4ade80;">${timeStr}</span>
                            ` : `

                            <span class="font-medium" style="color: rgba(203,213,225,0.8);">${dateStr}</span><span style="color: rgba(255,255,255,0.2);">Â·</span><span class="font-bold" style="color: #FACC15;">${timeStr}</span>
                            `}
                        </div>

                        <div class="mt-auto pt-3" style="border-top: 1px solid rgba(250,204,21,0.1);">
                            ${isLive ? `
                            <button onclick="triggerPlayerView('${safeUrl}', '${safeTitle}', '${imgSrc}', true)" class="lc-watch-btn w-full py-2.5 rounded-xl text-[12px] font-black tracking-widest flex items-center justify-center gap-2 transition-all duration-300" style="background: #FACC15; color: #000; box-shadow: 0 0 15px rgba(250,204,21,0.2); cursor: pointer;">
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> WATCH NOW
                            </button>
                            ` : `
                            <div class="w-full flex flex-col gap-2">
                                <div class="w-full rounded-xl overflow-hidden" style="background: rgba(20,15,5,0.5); border: 1px solid rgba(250,204,21,0.12);">
                                    <div class="px-3 pt-2 pb-1 text-center text-[8px] font-black tracking-[2.5px] uppercase" style="color: rgba(250,204,21,0.5);">Starts In</div>
                                    <div class="px-2 pb-2">
                                        <div class="countdown-timer flex items-center justify-center w-full px-2 py-1.5 rounded-xl relative overflow-hidden" data-time="${targetTime}" style="background: linear-gradient(135deg, rgba(30,20,5,0.9) 0%, rgba(20,15,5,0.9) 100%); border: 1px solid rgba(250,204,21,0.2);">

                                            <div class="relative z-10 flex flex-col items-center gap-1 pb-3"><span class="font-black text-themeYellow/40 leading-none" style="font-size: 14px; font-family: 'JetBrains Mono', monospace; animation: lc-led-blink 1.4s ease-in-out infinite;">:</span></div>
                                            <div class="relative z-10 flex flex-col items-center px-2.5 py-0.5"><span class="timer-s lc-timer-digit font-black text-themeYellow leading-none" style="font-size: 18px;">00</span><span class="text-[7px] font-bold tracking-[2px] uppercase mt-0.5 text-themeYellow/50">SEC</span></div>

            container.innerHTML = html;
            lucide.createIcons();
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return { dateStr: '', timeStr: '' };
            let ts = Number(timestamp);
            if (ts < 10_000_000_000) ts *= 1000;
            const d = new Date(ts);
            if (isNaN(d.getTime())) return { dateStr: '', timeStr: '' };
            const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const dateStr = `${String(d.getDate()).padStart(2,'0')} ${M[d.getMonth()]} ${d.getFullYear()}`;
            let h = d.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            const m = String(d.getMinutes()).padStart(2,'0');
            return { dateStr, timeStr: `${h}:${m} ${ampm}` };
        }

        setInterval(() => {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                let ts = parseInt(el.getAttribute('data-time'), 10);
                if (!ts) return;
                if (ts < 10_000_000_000) ts *= 1000;
                
                const diff = Math.max(0, Math.floor((ts - Date.now()) / 1000));
                const h = String(Math.floor(diff / 3600)).padStart(2,'0');
                const m = String(Math.floor((diff % 3600) / 60)).padStart(2,'0');
                const s = String(diff % 60).padStart(2,'0');
                
                const hEl = el.querySelector('.timer-h');
                const mEl = el.querySelector('.timer-m');
                const sEl = el.querySelector('.timer-s');

                if (hEl) hEl.innerText = h;
                if (mEl) mEl.innerText = m;
                if (sEl) sEl.innerText = s;
            });
        }, 1000);

        function initVideoPlayer(sourceUrl, title, poster, isLive) {
            document.getElementById('video-title').innerText = title;
            if (isLive) {
                document.getElementById('live-badge').classList.remove('hidden');
                document.getElementById('live-badge').classList.add('flex');
            } else {
                document.getElementById('live-badge').classList.add('hidden');
                document.getElementById('live-badge').classList.remove('flex');
            }

            const video = document.getElementById('plyr-video');
            video.poster = poster;

            const defaultOptions = {
                controls: [
                    'play-large', 'rewind', 'play', 'fast-forward', 
                    'progress', 'current-time', 'duration', 
                    'mute', 'volume', 'fullscreen'
                ],
                seekTime: 10,
                autoplay: true,
                keyboard: { focused: true, global: true }
            };

            if (sourceUrl.includes('.m3u8') && Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 60 });
                hls.loadSource(sourceUrl);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const qualityContainer = document.getElementById('quality-controls');
                    if (qualityContainer) {
                        let html = `<button onclick="setQuality(-1)" class="control-btn quality-btn active" data-val="-1">Auto</button>`;
                        hls.levels.forEach((l, idx) => { 
                            html += `<button onclick="setQuality(${idx})" class="control-btn quality-btn" data-val="${idx}">${l.height}p</button>`; 
                        });
                        qualityContainer.innerHTML = html;
                    }
                    window.playerInstance = new Plyr(video, defaultOptions);
                    setupCustomPlyr(window.playerInstance);
                });

                hls.attachMedia(video);
                window.hlsInstance = hls;
            } else {
                video.src = sourceUrl;
                const qualityContainer = document.getElementById('quality-controls');
                if (qualityContainer) qualityContainer.innerHTML = `<span class="text-stone-500 text-xs">Auto (Native)</span>`;
                window.playerInstance = new Plyr(video, defaultOptions);
                setupCustomPlyr(window.playerInstance);
            }
            
            setTimeout(() => lucide.createIcons(), 100);
        }

        function setupCustomPlyr(player) {
            player.on('ready', () => {
                const rewindBtn = document.querySelector('[data-plyr="rewind"]');
                if (rewindBtn) {
                    rewindBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="custom-icon-svg" style="width: 22px; height: 22px; margin: auto;">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                            <text x="12" y="16.5" font-size="7" font-weight="900" font-family="sans-serif" class="custom-icon-text" text-anchor="middle">10</text>
                        </svg>`;
                }
                
                const forwardBtn = document.querySelector('[data-plyr="fast-forward"]');
                if (forwardBtn) {
                    forwardBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="custom-icon-svg" style="width: 22px; height: 22px; margin: auto;">
                            <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <text x="12" y="16.5" font-size="7" font-weight="900" font-family="sans-serif" class="custom-icon-text" text-anchor="middle">10</text>
                        </svg>`;
                }
            });

            player.on('enterfullscreen', () => {
                try { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); } } catch (e) {}
            });
            player.on('exitfullscreen', () => {
                try { if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); } } catch (e) {}
            });
        }

        window.setQuality = function(index) {
            if(window.hlsInstance) {
                window.hlsInstance.currentLevel = index;
                document.querySelectorAll('.quality-btn').forEach(btn => {
                    if (parseInt(btn.dataset.val) === index) btn.classList.add('active'); else btn.classList.remove('active');
                });
            }
        };

        window.setSpeed = function(speed) {
            if (window.playerInstance) window.playerInstance.speed = speed;
            const video = document.getElementById('plyr-video');
            if (video) video.playbackRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                if (parseFloat(btn.dataset.val) === speed) btn.classList.add('active'); else btn.classList.remove('active');
            });
        };

        window.toggleFullScreen = function() {
            const playerContainer = document.querySelector('.plyr') || document.getElementById('plyr-video');
            const videoEl = document.getElementById('plyr-video');
            if (!playerContainer) return;
            
            if (videoEl && typeof videoEl.webkitEnterFullscreen === 'function') { videoEl.webkitEnterFullscreen(); return; }

            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerContainer.requestFullscreen) { playerContainer.requestFullscreen().catch(() => { if (videoEl && videoEl.webkitEnterFullscreen) videoEl.webkitEnterFullscreen(); }); } 
                else if (playerContainer.webkitRequestFullscreen) { playerContainer.webkitRequestFullscreen(); } 
                else if (playerContainer.msRequestFullscreen) { playerContainer.msRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } 
            }
        };

        // Initial Load Config
        lucide.createIcons();
        switchTab('LIVE');

        // Execute load based on URL param directly on initialization
        loadCourseClasses();

    </script>
