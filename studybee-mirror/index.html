,"thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/110723540697_Prarambh%20BATCh%20Humanites09.jpg"},{"id":53,"title":"PRARAMBH HUMANITIES 11TH 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/216113028517_Prarambh%20BATCh%20Humanities%2011.png"},{"id":55,"title":"PRARAMBH SCIENCE 11TH (PCMB) 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/183130728609_Prarambh%20BATCh%20Science%20Class%2011.png"},{"id":56,"title":"PRARAMBH COMMERCE 11TH 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/737975028610_Prarambh%20BATCh%20Commerce%2011.png"},{"id":58,"title":"PRARAMBH SCIENCE 12TH (PCMB) 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/337551428612_Prarambh%20BATCh%20Science%2012.jpg"},{"id":57,"title":"PRARAMBH COMMERCE 12TH 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/677190628611_Prarambh%20BATCh%20Commerce%2012.jpg"},{"id":59,"title":"PRARAMBH HUMANITIES 12TH 2025-26","thumbnail":"https://dxixtlyravvxx.cloudfront.net/540/admin_v1/bundle_management/course/205624828613_Prarambh%20BATCh%20Humanities%2012.jpg"}]};

        // DOM Elements
        const batchGrid = document.getElementById('batchGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadMoreContainer = document.getElementById('loadMoreContainer');

        document.addEventListener('DOMContentLoaded', () => {
            updateWishlistCount();
            fetchBatches();
        });

        window.handleStudyClick = function(event, batchId) {
            event.preventDefault();
            window.location.href = `content.html?id=${batchId}`;
        };

        async function fetchBatches() {
            try {
                const response = await fetch('batches.json');
                if (!response.ok) throw new Error("Failed to load JSON");
                const json = await response.json();
                batchesData = json && (json.new || json.old) ? json : EMBEDDED_BATCHES;
            } catch (error) {
                console.warn("batches.json fetch failed, using embedded fallback:", error);
                batchesData = EMBEDDED_BATCHES;
            }
            
            loadingIndicator.classList.add('hidden');
            batchGrid.classList.remove('hidden');
            applyFiltersAndRender(true);
        }

        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            applyFiltersAndRender(true);
        });

        window.clearSearch = function() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            applyFiltersAndRender(true);
            searchInput.focus();
        }

        window.switchTab = function(tabName, updateUI = true) {
            currentTab = tabName;
            
            if(updateUI) {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                
                // Reset all tabs
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('bg-border', 'text-white', 'shadow-sm', 'font-semibold');
                    btn.classList.add('text-gray-400', 'font-medium');
                });
                
                document.querySelectorAll('.tab-btn i').forEach(icon => {
                    icon.classList.remove('text-primary');
                });
                
                // Set active tab
                const activeBtn = document.getElementById(`tab-${tabName}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-gray-400', 'font-medium');
                    activeBtn.classList.add('bg-border', 'text-white', 'shadow-sm', 'font-semibold');
                }
                
                const activeIcon = document.getElementById(`icon-${tabName}`);
                if (activeIcon) {
                    activeIcon.classList.add('text-primary');
                }
            }
            
            applyFiltersAndRender(true);
        };

        function applyFiltersAndRender(resetPagination = false) {
            const query = searchInput.value.toLowerCase().trim();
            
            if (currentTab === 'wishlist') {
                const allBatches = [...(batchesData.new || []), ...(batchesData.old || [])];
                const uniqueBatches = Array.from(new Map(allBatches.map(item => [String(item.id), item])).values());
                currentFilteredData = uniqueBatches.filter(batch => wishlist.includes(String(batch.id)));
            } else {
                currentFilteredData = batchesData[currentTab] || [];
            }

            if (query) {
                currentFilteredData = currentFilteredData.filter(batch => {
                    return batch.title.toLowerCase().includes(query) || String(batch.id).includes(query);
                });
            }

            if (resetPagination) {
                currentlyDisplayedCount = 0;
                batchGrid.innerHTML = '';
            }

            renderBatchSlice();
        }

        function renderBatchSlice() {
            if (currentFilteredData.length === 0) {
                batchGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                loadMoreContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            batchGrid.classList.remove('hidden');

            const nextCount = Math.min(currentlyDisplayedCount + ITEMS_PER_PAGE, currentFilteredData.length);
            const itemsToRender = currentFilteredData.slice(currentlyDisplayedCount, nextCount);
            
            const html = itemsToRender.map((batch, index) => createCardHTML(batch, index)).join('');
            
            if (currentlyDisplayedCount === 0) {
                batchGrid.innerHTML = html;
            } else {
                batchGrid.insertAdjacentHTML('beforeend', html);
            }

            currentlyDisplayedCount = nextCount;

            if (currentlyDisplayedCount < currentFilteredData.length) {
                loadMoreContainer.classList.remove('hidden');
            } else {
                loadMoreContainer.classList.add('hidden');
            }
        }

        window.loadMore = function() {
            const btn = document.getElementById('loadMoreBtn');
            if (btn.disabled) return;
            
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="ph-duotone ph-spinner animate-spin text-lg"></i> Loading...`;
            
            setTimeout(() => {
                renderBatchSlice();
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }, 400);
        };

        function createCardHTML(batch, index) {
            const id = String(batch.id);
            const isInWishlist = wishlist.includes(id);
            const heartIconClass = isInWishlist ? 'ph-fill ph-heart text-red-500 scale-110' : 'ph-duotone ph-heart text-white group-hover/wish:text-red-400';
            const delay = (index % ITEMS_PER_PAGE) * 50 + 'ms'; // Staggered intro

            const hasPro = batch.title && batch.title.toUpperCase().includes('PRO');
            const proBadgeHTML = hasPro ? `
                <!-- Top Badges -->
                <div class="absolute top-3 left-3 flex items-center gap-2">
                    <span class="bg-black/60 backdrop-blur border border-white/10 text-[10px] font-mono uppercase tracking-wider px-2 py-1 rounded text-white flex items-center gap-1 shadow-glass">
                        <i class="ph-fill ph-star text-primary"></i> PRO
                    </span>
                </div>
            ` : '';

            return `
                <div class="premium-card bg-surface rounded-2xl overflow-hidden flex flex-col relative pop-in border border-border group" style="animation-delay: ${delay}">
                    <!-- Image Area -->
                    <div class="relative w-full aspect-video overflow-hidden bg-background border-b border-border shine-effect cursor-pointer" onclick="handleStudyClick(event, '${id}')">
                        <img src="${batch.thumbnail}" alt="Thumbnail" loading="lazy" class="card-img w-full h-full object-cover transition-transform duration-700 ease-out">
                        
                        <!-- Overlay Gradients -->
                        <div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent opacity-90"></div>
                        
                        ${proBadgeHTML}

                        <!-- Wishlist Button -->
                        <button onclick="toggleWishlist(event, '${id}')" class="absolute top-3 right-3 w-9 h-9 bg-black/40 backdrop-blur rounded-full flex items-center justify-center border border-white/20 hover:bg-surface transition-all duration-300 btn-press z-20 group/wish">
                            <i id="heart-icon-${id}" class="${heartIconClass} text-[18px] transition-all duration-300"></i>
                        </button>
                        
                        <!-- Play Button Overlay -->
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-10">
                            <div class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center border border-white/20 transform scale-75 group-hover:scale-100 transition-transform duration-300">
                                <i class="ph-fill ph-play text-2xl text-white ml-1"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Content Area -->
                    <div class="p-5 flex flex-col flex-1 relative z-20">
                        <h3 class="text-white font-semibold text-[15px] leading-snug mb-4 line-clamp-2 group-hover:text-primary transition-colors duration-300">${batch.title}</h3>
                        
                        <div class="mt-auto flex items-center justify-between pt-4 border-t border-border/50">
                            <div class="flex flex-col">
                                <span class="text-[9px] text-gray-500 font-mono uppercase tracking-widest mb-0.5">Access</span>
                                <span class="text-green-400 font-mono text-[11px] font-bold flex items-center gap-1.5">
                                    <span class="relative flex h-2 w-2">
                                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                    </span> Free
                                </span>
                            </div>
                            
                            <button onclick="handleStudyClick(event, '${id}')" class="bg-gradient-to-r from-primary to-orange-500 text-black px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 btn-press flex items-center gap-2 shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-0.5">
                                Let's Study <i class="ph-bold ph-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleWishlist = function(event, batchId) {
            event.stopPropagation();
            batchId = String(batchId);
            
            const index = wishlist.indexOf(batchId);
            const iconEls = document.querySelectorAll(`#heart-icon-${batchId}`);
            
            if (index === -1) {
                wishlist.push(batchId);
                iconEls.forEach(iconEl => {
                    iconEl.className = 'ph-fill ph-heart text-red-500 scale-125 transition-all duration-300';
                    setTimeout(() => iconEl.classList.replace('scale-125', 'scale-110'), 200);
                });
            } else {
                wishlist.splice(index, 1);
                iconEls.forEach(iconEl => {
                    iconEl.className = 'ph-duotone ph-heart text-white group-hover/wish:text-red-400 transition-all duration-300 scale-100';
                });
                
                if (currentTab === 'wishlist') {
                    // Slight delay to allow animation to finish before removing from dom
                    setTimeout(() => applyFiltersAndRender(true), 300);
                }
            }

            localStorage.setItem('valence_wishlist', JSON.stringify(wishlist));
            updateWishlistCount();
        };

        function updateWishlistCount() {
            const badge = document.getElementById('wishlist-badge');
            
            if (wishlist.length > 0) {
                badge.innerText = wishlist.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
